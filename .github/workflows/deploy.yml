name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate access-gate config from secret
        env:
          THE_ACCESS_CODE: ${{ secrets.THE_ACCESS_CODE }}
        run: |
          if [ -z "$THE_ACCESS_CODE" ]; then
            echo "::error::THE_ACCESS_CODE secret is not set on the github-pages environment."
            exit 1
          fi
          HASH=$(printf '%s' "$THE_ACCESS_CODE" | sha256sum | cut -d' ' -f1)
          printf 'export const PASSWORD_HASH = "%s";\n' "$HASH" > js/auth-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This repo IS the site root (no build step — it's a plain
          # static HTML/CSS/JS site), so upload everything as-is.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
